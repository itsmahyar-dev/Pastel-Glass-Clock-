<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page title -->
    <title>Glass Clock</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =====================================================
         MAIN CLOCK
         ===================================================== -->

    <div class="clock">
      <!-- Second hand -->
      <div class="second-point"></div>

      <!-- Minute hand -->
      <div class="minute-point"></div>

      <!-- Hour hand -->
      <div class="hour-point"></div>

      <!-- Center bubble -->
      <div class="center"></div>

      <!-- =================================================
             DIGITAL CLOCK
             ================================================= -->

      <div class="numeric">
        <!-- Current digital time -->
        <div id="numeric">00:00:00</div>
      </div>
    </div>

    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="app.js"></script>
  </body>
</html>
